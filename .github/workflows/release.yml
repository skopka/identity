name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  validate:
    name: Validate release packages
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      release_version: ${{ steps.version.outputs.value }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify release commit belongs to main
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          TAG_COMMIT=$(git rev-list -n 1 "$RELEASE_TAG")
          if ! git merge-base --is-ancestor "$TAG_COMMIT" origin/main; then
            echo "Release tag must point to a commit reachable from origin/main." >&2
            exit 1
          fi

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json

      - name: Determine version from tag
        id: version
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          VERSION="${RELEASE_TAG#v}"
          PRERELEASE_IDENTIFIER='(0|[1-9][0-9]*|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*)'
          SEMVER_PATTERN="^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-${PRERELEASE_IDENTIFIER}(\.${PRERELEASE_IDENTIFIER})*)?$"
          if [[ ! "$VERSION" =~ $SEMVER_PATTERN ]]; then
            echo "Release tag must be v followed by SemVer without build metadata." >&2
            exit 1
          fi
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Restore
        run: dotnet restore Skopka.Identity.slnx

      - name: Verify declared release line
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.value }}
        run: |
          DECLARED_VERSION=$(dotnet msbuild src/Skopka.Identity/Skopka.Identity.csproj -getProperty:VersionPrefix -nologo)
          RELEASE_BASE_VERSION="${RELEASE_VERSION%%-*}"
          if [[ "$DECLARED_VERSION" != "$RELEASE_BASE_VERSION" ]]; then
            echo "Tag base version '$RELEASE_BASE_VERSION' does not match VersionPrefix '$DECLARED_VERSION'." >&2
            exit 1
          fi

      - name: Build
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.value }}
        run: >
          dotnet build Skopka.Identity.slnx
          --configuration Release
          --no-restore
          -p:Version="$RELEASE_VERSION"

      - name: Test
        run: >
          dotnet test Skopka.Identity.slnx
          --configuration Release
          --no-build
          --logger trx
          --results-directory artifacts/test-results

      - name: Audit NuGet dependencies
        run: >
          dotnet list Skopka.Identity.slnx package
          --vulnerable
          --include-transitive
          --no-restore

      - name: Pack
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.value }}
        run: >
          dotnet pack Skopka.Identity.slnx
          --configuration Release
          --no-build
          --no-restore
          --output artifacts/packages
          -p:Version="$RELEASE_VERSION"

      - name: Verify package set
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.value }}
        run: |
          EXPECTED_PACKAGES=(
            "Skopka.Identity"
            "Skopka.Identity.Abstractions"
            "Skopka.Identity.Core"
            "Skopka.Identity.Ef"
            "Skopka.Identity.Ef.PostgreSql"
            "Skopka.Identity.Infrastructure"
          )

          for PACKAGE_ID in "${EXPECTED_PACKAGES[@]}"; do
            for EXTENSION in nupkg snupkg; do
              PACKAGE_PATH="artifacts/packages/${PACKAGE_ID}.${RELEASE_VERSION}.${EXTENSION}"
              if [[ ! -f "$PACKAGE_PATH" ]]; then
                echo "Expected package '$PACKAGE_PATH' was not produced." >&2
                exit 1
              fi
            done
          done

          NUPKG_COUNT=$(find artifacts/packages -maxdepth 1 -type f -name '*.nupkg' | wc -l)
          SNUPKG_COUNT=$(find artifacts/packages -maxdepth 1 -type f -name '*.snupkg' | wc -l)
          if [[ "$NUPKG_COUNT" -ne 6 || "$SNUPKG_COUNT" -ne 6 ]]; then
            echo "Expected 6 packages and 6 symbol packages, found $NUPKG_COUNT and $SNUPKG_COUNT." >&2
            exit 1
          fi

      - name: Restore package consumer
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.value }}
        run: >
          dotnet restore tests/Skopka.Identity.PackageConsumer/Skopka.Identity.PackageConsumer.csproj
          -p:RestoreAdditionalProjectSources="${{ github.workspace }}/artifacts/packages"
          -p:IdentityPackageVersion="$RELEASE_VERSION"

      - name: Run package consumer
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.value }}
        run: >
          dotnet run
          --project tests/Skopka.Identity.PackageConsumer/Skopka.Identity.PackageConsumer.csproj
          --configuration Release
          --no-restore
          -p:IdentityPackageVersion="$RELEASE_VERSION"

      - name: Upload release packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-packages
          path: |
            artifacts/packages/*.nupkg
            artifacts/packages/*.snupkg
          if-no-files-found: error
          retention-days: 30

  publish-nuget:
    name: Publish coordinated NuGet set
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: release

    steps:
      - name: Check out release metadata
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json

      - name: Download release packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-packages
          path: artifacts/packages

      - name: Require a completely unpublished version
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.release_version }}
        run: |
          VERSION_LOWER="${RELEASE_VERSION,,}"
          PACKAGE_IDS=(
            "skopka.identity"
            "skopka.identity.abstractions"
            "skopka.identity.core"
            "skopka.identity.ef"
            "skopka.identity.ef.postgresql"
            "skopka.identity.infrastructure"
          )

          for PACKAGE_ID in "${PACKAGE_IDS[@]}"; do
            PACKAGE_URL="https://api.nuget.org/v3-flatcontainer/${PACKAGE_ID}/${VERSION_LOWER}/${PACKAGE_ID}.${VERSION_LOWER}.nupkg"
            STATUS=$(curl --silent --output /dev/null --write-out '%{http_code}' "$PACKAGE_URL")
            if [[ "$STATUS" == "200" ]]; then
              echo "Package ${PACKAGE_ID} ${RELEASE_VERSION} already exists; release artifacts are immutable." >&2
              exit 1
            fi
            if [[ "$STATUS" != "404" ]]; then
              echo "Could not prove ${PACKAGE_ID} ${RELEASE_VERSION} is unpublished; NuGet.org returned HTTP ${STATUS}." >&2
              exit 1
            fi
          done

      - name: Push every package to NuGet.org
        id: nuget_push
        shell: bash
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
          RELEASE_VERSION: ${{ needs.validate.outputs.release_version }}
        run: |
          PACKAGE_IDS=(
            "Skopka.Identity.Abstractions"
            "Skopka.Identity.Core"
            "Skopka.Identity.Ef"
            "Skopka.Identity.Ef.PostgreSql"
            "Skopka.Identity.Infrastructure"
            "Skopka.Identity"
          )

          for PACKAGE_ID in "${PACKAGE_IDS[@]}"; do
            dotnet nuget push "artifacts/packages/${PACKAGE_ID}.${RELEASE_VERSION}.nupkg" \
              --api-key "$NUGET_API_KEY" \
              --source "https://api.nuget.org/v3/index.json"
          done

      - name: Wait until every package is available on NuGet.org
        if: ${{ always() }}
        shell: bash
        env:
          PUSH_OUTCOME: ${{ steps.nuget_push.outcome }}
          RELEASE_VERSION: ${{ needs.validate.outputs.release_version }}
        run: |
          VERSION_LOWER="${RELEASE_VERSION,,}"
          PACKAGE_IDS=(
            "skopka.identity"
            "skopka.identity.abstractions"
            "skopka.identity.core"
            "skopka.identity.ef"
            "skopka.identity.ef.postgresql"
            "skopka.identity.infrastructure"
          )

          for ATTEMPT in {1..60}; do
            MISSING=()
            for PACKAGE_ID in "${PACKAGE_IDS[@]}"; do
              PACKAGE_URL="https://api.nuget.org/v3-flatcontainer/${PACKAGE_ID}/${VERSION_LOWER}/${PACKAGE_ID}.${VERSION_LOWER}.nupkg"
              if ! curl --fail --silent --show-error --head "$PACKAGE_URL" > /dev/null; then
                MISSING+=("$PACKAGE_ID")
              fi
            done

            if [[ "${#MISSING[@]}" -eq 0 ]]; then
              if [[ "$PUSH_OUTCOME" != "success" ]]; then
                echo "All packages are visible, but NuGet push reported a failure; symbol publication is not proven. Do not reuse this version." >&2
                exit 1
              fi
              echo "All packages are available on NuGet.org."
              exit 0
            fi

            echo "Attempt ${ATTEMPT}: waiting for ${MISSING[*]}"
            sleep 10
          done

          echo "The version was only partially published. Do not reuse it; fix the cause and release a new patch version." >&2
          exit 1

  publish-release:
    name: Publish GitHub release
    needs:
      - validate
      - publish-nuget
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download release packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-packages
          path: artifacts/packages

      - name: Create GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          generate_release_notes: true
          prerelease: ${{ contains(needs.validate.outputs.release_version, '-') }}
          fail_on_unmatched_files: true
          files: |
            artifacts/packages/*.nupkg
            artifacts/packages/*.snupkg
