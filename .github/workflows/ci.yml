name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  build-test-pack:
    name: Build, test and pack
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Skopka.Identity.slnx

      - name: Build
        run: >
          dotnet build Skopka.Identity.slnx
          --configuration Release
          --no-restore

      - name: Test
        run: >
          dotnet test Skopka.Identity.slnx
          --configuration Release
          --no-build
          --logger trx
          --results-directory artifacts/test-results

      - name: Audit NuGet dependencies
        run: >
          dotnet list Skopka.Identity.slnx package
          --vulnerable
          --include-transitive
          --no-restore

      - name: Determine package version
        id: package_version
        shell: bash
        run: |
          VERSION="$(dotnet msbuild src/Skopka.Identity/Skopka.Identity.csproj -getProperty:PackageVersion -nologo)"
          if [[ -z "$VERSION" ]]; then
            echo "The package version could not be determined." >&2
            exit 1
          fi
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Pack
        run: >
          dotnet pack Skopka.Identity.slnx
          --configuration Release
          --no-build
          --no-restore
          --output artifacts/packages

      - name: Verify package set
        shell: bash
        env:
          PACKAGE_VERSION: ${{ steps.package_version.outputs.value }}
        run: |
          EXPECTED_PACKAGES=(
            "Skopka.Identity"
            "Skopka.Identity.Abstractions"
            "Skopka.Identity.Core"
            "Skopka.Identity.Ef"
            "Skopka.Identity.Ef.PostgreSql"
            "Skopka.Identity.Infrastructure"
          )

          for PACKAGE_ID in "${EXPECTED_PACKAGES[@]}"; do
            for EXTENSION in nupkg snupkg; do
              PACKAGE_PATH="artifacts/packages/${PACKAGE_ID}.${PACKAGE_VERSION}.${EXTENSION}"
              if [[ ! -f "$PACKAGE_PATH" ]]; then
                echo "Expected package '$PACKAGE_PATH' was not produced." >&2
                exit 1
              fi
            done
          done

          NUPKG_COUNT=$(find artifacts/packages -maxdepth 1 -type f -name '*.nupkg' | wc -l)
          SNUPKG_COUNT=$(find artifacts/packages -maxdepth 1 -type f -name '*.snupkg' | wc -l)
          if [[ "$NUPKG_COUNT" -ne 6 || "$SNUPKG_COUNT" -ne 6 ]]; then
            echo "Expected 6 packages and 6 symbol packages, found $NUPKG_COUNT and $SNUPKG_COUNT." >&2
            exit 1
          fi

      - name: Restore package consumer
        env:
          PACKAGE_VERSION: ${{ steps.package_version.outputs.value }}
        run: >
          dotnet restore tests/Skopka.Identity.PackageConsumer/Skopka.Identity.PackageConsumer.csproj
          -p:RestoreAdditionalProjectSources="${{ github.workspace }}/artifacts/packages"
          -p:IdentityPackageVersion="$PACKAGE_VERSION"

      - name: Run package consumer
        env:
          PACKAGE_VERSION: ${{ steps.package_version.outputs.value }}
        run: >
          dotnet run
          --project tests/Skopka.Identity.PackageConsumer/Skopka.Identity.PackageConsumer.csproj
          --configuration Release
          --no-restore
          -p:IdentityPackageVersion="$PACKAGE_VERSION"

      - name: Upload NuGet packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: nuget-packages
          path: |
            artifacts/packages/*.nupkg
            artifacts/packages/*.snupkg
          if-no-files-found: error
          retention-days: 14
